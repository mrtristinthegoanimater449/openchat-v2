name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          # Use the default selected Xcode; GitHub's macos-latest image ships a recent one.

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -e
          xcodebuild \
            -project OpenChatV2.xcodeproj \
            -scheme OpenChatV2 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -e
          APP_PATH=$(find build -name "OpenChatV2.app" -type d | head -1)
          echo "App: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry OpenChatV2-unsigned.ipa Payload
          ls -lh OpenChatV2-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenChatV2-unsigned-ipa
          path: ios/OpenChatV2-unsigned.ipa
          retention-days: 14
