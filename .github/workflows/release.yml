name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -e
          xcodegen generate
          xcodebuild \
            -project OpenChatV2.xcodeproj \
            -scheme OpenChatV2 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build
          APP_PATH=$(find build -name "OpenChatV2.app" -type d | head -1)
          echo "App: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry OpenChatV2-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ios/OpenChatV2-unsigned.ipa
          retention-days: 1

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses & install packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -L --fail -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: android
        run: |
          gradle :app:assembleDebug --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk ../OpenChatV2-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: OpenChatV2-debug.apk
          retention-days: 1

  release:
    needs: [ipa, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ipa

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete v2.0.0 --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create v2.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenChat V2" \
            --notes "OpenChat V2 (native apps, unsigned)

          - OpenChatV2-unsigned.ipa — install via AltStore/Sideloadly
          - OpenChatV2-debug.apk — Android debug build

          Server: https://lid-graduation-automotive-mere.trycloudflare.com
          (update the app if the tunnel URL changes)" \
            OpenChatV2-unsigned.ipa OpenChatV2-debug.apk
