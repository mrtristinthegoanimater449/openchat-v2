name: OpenChatV2
options:
  bundleIdPrefix: app.openchat
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.9"

targets:
  OpenChatV2:
    type: application
    platform: iOS
    sources:
      - path: OpenChatV2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openchat.v2
        PRODUCT_NAME: OpenChatV2
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenChat V2
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
