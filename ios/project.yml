name: OpenChatV2
options:
  bundleIdPrefix: app.openchat
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.9"

targets:
  OpenChatV2:
    type: application
    platform: iOS
    sources:
      - path: OpenChatV2
    info:
      path: OpenChatV2/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openchat.v2
        PRODUCT_NAME: OpenChatV2
